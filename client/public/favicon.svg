<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hunt-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="hunt-grad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="hunt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="120" height="120" rx="30" fill="url(#hunt-bg)"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="28.5" stroke="#312E81" stroke-width="2"/>

  <!-- Stylized Geometric 'H' with Crosshair/Lightning Vector -->
  <g filter="url(#hunt-glow)">
    <!-- Left vertical bar -->
    <rect x="32" y="28" width="14" height="64" rx="7" fill="url(#hunt-grad)"/>
    <!-- Right vertical bar -->
    <rect x="74" y="28" width="14" height="64" rx="7" fill="url(#hunt-grad)"/>
    <!-- Center energetic crossbar -->
    <path d="M 40 60 L 80 60" stroke="#06B6D4" stroke-width="12" stroke-linecap="round"/>
    <!-- Radar / target focal pip -->
    <circle cx="60" cy="60" r="5" fill="#FFFFFF"/>
  </g>
</svg>